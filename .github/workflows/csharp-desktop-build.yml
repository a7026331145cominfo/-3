name: Build AlSaqarERP CSharp Desktop
on:
  push:
    branches: [main]
    paths:
      - 'desktop-csharp/**'
      - '.github/workflows/csharp-desktop-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop-csharp/**'
      - '.github/workflows/csharp-desktop-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore for Windows x64
        run: dotnet restore desktop-csharp/AlSaqarERP.Desktop.csproj --runtime win-x64
      - name: Build
        run: dotnet build desktop-csharp/AlSaqarERP.Desktop.csproj --configuration Release --runtime win-x64 --no-restore
      - name: Publish self-contained Windows x64 app
        run: dotnet publish desktop-csharp/AlSaqarERP.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/csharp-desktop
      - name: Upload CSharp desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlSaqarERP-CSharp-Desktop-win-x64
          path: artifacts/csharp-desktop/
          if-no-files-found: error
