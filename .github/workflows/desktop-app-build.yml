name: Build AlSaqar ERP Windows Desktop Installer

on:
  push:
    branches: [main]
    paths:
      - 'web-client/**'
      - '.github/workflows/desktop-app-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web-client/**'
      - '.github/workflows/desktop-app-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web-client
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and refresh Bun lock locally
        run: bun install

      - name: Type-check source
        run: bun run lint

      - name: Build Windows installer
        run: bun run desktop:dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AlSaqarERP-Windows-Installer
          path: web-client/release/*.exe
          if-no-files-found: error
          retention-days: 30
